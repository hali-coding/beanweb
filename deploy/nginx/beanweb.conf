# beanweb.halicode.com (prod) on sysweb1 -- installed by hand, see deploy/README.md.
#
# sysweb1 is shared with other sites, so this file claims nothing it does not
# name: no default_server, its own logs, and every path prefixed beanweb-.
# Traffic arrives through Cloudflare's proxy (SSL mode Full (strict)), so the
# origin still needs a real certificate.
#
# Origin lock: only Cloudflare's edge (and the box itself) may connect; any
# other address gets 403, as the Apache `Allow from` list did. The test reads
# $from_cloudflare, a geo map in conf.d/cloudflare-geo.conf keyed on
# $realip_remote_addr. It cannot be a plain allow/deny list: the real-IP
# snippet rewrites $remote_addr to the *visitor* before access checks run, so
# allow-listing Cloudflare there would turn every visitor away.

server {
    listen 80;
    listen [::]:80;
    server_name beanweb.halicode.com;

    include snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/beanweb.access.log;
    error_log  /var/log/nginx/beanweb.error.log;

    if ($from_cloudflare = 0) { return 403; }

    # Let's Encrypt HTTP-01 renewals. Served on both ports, so renewal still
    # works if Cloudflare is later set to "Always Use HTTPS" and the challenge
    # arrives on 443 instead.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beanweb.halicode.com;

    # Issued with `certbot certonly --webroot --cert-name beanweb`, so
    # certbot never edits this file.
    ssl_certificate     /etc/letsencrypt/live/beanweb/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beanweb/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare's edge ranges -> real visitor IPs in the logs. Generated on
    # the host, not kept here, because the ranges drift (deploy/README.md).
    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/beanweb.access.log;
    error_log  /var/log/nginx/beanweb.error.log;

    if ($from_cloudflare = 0) { return 403; }

    root /var/www/beanweb;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # The Coffee Shop backend: a container published on loopback only.
    location /api/coffeeshop {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes everything under assets/, so it never changes in
    # place; index.html names the current hashes and must always revalidate,
    # or a deploy goes unseen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
