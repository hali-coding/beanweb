version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /coffeeshop
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      # Kept apart so one breaking upgrade cannot hold back the routine batch.
      npm-major:
        applies-to: version-updates
        patterns: ['*']
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # The directory is /, and Dependabot looks in .github/workflows from there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
