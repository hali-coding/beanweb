name: Bean Bot

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, reopened]

concurrency:
  group: bean-bot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  bean-bot:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@bean-bot')) ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Only the base ref is ever checked out. The PR head is untrusted code and
      # this job runs privileged (issue_comment, contents: write), so bean-bot
      # reads and writes docs/pr-updates.md through the Contents API instead.
      - name: Checkout workflow ref (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          path: bean-bot

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "24"

      - name: Run bean-bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node bean-bot/.github/scripts/bean-bot.mjs