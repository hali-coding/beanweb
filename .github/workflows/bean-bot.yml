name: Bean Bot

on:
  issue_comment:
    types: [created, edited]

concurrency:
  group: bean-bot-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  bean-bot:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@bean-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout workflow ref (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          path: bean-bot

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          path: pr

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "24"

      - name: Run bean-bot
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node ../bean-bot/.github/scripts/bean-bot.mjs