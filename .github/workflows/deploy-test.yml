name: Deploy to test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment_name: test
      deploy_path: /var/www/beanweb-test/
      remote_user: ci
      web_server: nginx
    secrets: inherit
