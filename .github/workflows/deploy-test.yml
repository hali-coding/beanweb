name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: |
          echo -e "\033[1;34m📦 Installing dependencies...\033[0m"
          npm config set audit false
          npm config set fund false
          npm ci

      - name: 🔨 Build
        run: |
          echo -e "\033[1;35m🔨 Building the app...\033[0m"
          npm run build
          echo -e "\033[1;32m✅ Build complete!\033[0m"

      - name: 🔐 Configure SSH
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo -e "\033[1;33m🔐 Setting up SSH access...\033[0m"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          echo -e "\033[1;32m✅ SSH ready!\033[0m"

      - name: 📤 Upload build output
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo -e "\033[1;36m📤 Uploading dist/ to ${SERVER_IP}...\033[0m"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "github@${SERVER_IP}:/var/www/beanweb-test/"
          echo -e "\033[1;32m✅ Upload complete!\033[0m"

      - name: 🔄 Restart apache2
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo -e "\033[1;33m🔄 Restarting apache2...\033[0m"
          ssh -i ~/.ssh/deploy_key "github@${SERVER_IP}" "sudo systemctl restart apache2"
          echo -e "\033[1;32m🎉 Deploy finished!\033[0m"
