name: Packages

# Packages are not part of the app bundle -- they are installed into it -- so
# they are built here rather than in `pr.yml`, and the .pkg files come out as a
# downloadable artifact. `pr.yml` still runs the whole suite, which includes
# `tests/pkgs.test.ts`; this workflow is what produces something to install.
#
# On main (push or a manual run from main) a second job publishes the same
# .pkg files to the test server's Coffee Shop catalogue, so what the store
# lists is always what this workflow built and verified -- never a file
# copied there by hand. PRs only build.
#
# The two `paths` lists are duplicated rather than shared through a YAML
# anchor: anchors are not documented as supported in workflow files, and a
# parse failure here would take the whole workflow out.
on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      # The format lives here. A change to it can make a package that built
      # yesterday unreadable, so rebuild and re-verify when it moves.
      - 'src/lib/packages/**'
      - '.github/workflows/packages.yml'
      - 'package-lock.json'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pkgs/**'
      - 'src/lib/packages/**'
      - '.github/workflows/packages.yml'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: pkgs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm config set audit false
          npm config set fund false
          npm ci

      # One build, which also writes the manifest that goes in the artifact.
      # `mkdir` first because the redirect opens the file before the build has
      # made the directory. Doing the manifest as a second `--json` run instead
      # would rebuild the .pkg files, and anything rebuilt after the checksums
      # below would make them a claim about a file that no longer exists.
      - name: Build packages
        run: |
          mkdir -p pkgs/dist
          node pkgs/build.mjs --json > pkgs/dist/packages.json
          cat pkgs/dist/packages.json

      # Reads every .pkg back through the same reader Coffee Shop uses, so
      # the artifact is known to install rather than merely known to exist.
      # This does rebuild them -- and asserts the rebuild is byte-identical,
      # which is what lets the checksums below be taken afterwards at all.
      - name: Verify they are installable
        run: npx vitest run tests/pkgs.test.ts

      # Last thing to touch the files, so the sums describe what ships.
      - name: Checksums
        working-directory: pkgs/dist
        run: sha256sum *.pkg | tee SHA256SUMS

      - name: Summary
        run: |
          {
            echo '### Packages'
            echo
            echo '| Package | Id | Version | Size |'
            echo '|---|---|---|---|'
            jq -r '.[] | "| \(.name) | `\(.id)` | \(.version) | \(.bytes / 1024 * 10 | round / 10) KB |"' \
              pkgs/dist/packages.json
            echo
            echo 'Download the **packages** artifact below, then install a `.pkg`'
            echo 'from Coffee Shop: *File -> Install from This computer…*'
            echo
            echo '<details><summary>SHA-256</summary>'
            echo
            echo '```'
            cat pkgs/dist/SHA256SUMS
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: packages
          path: pkgs/dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to the test catalogue
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds SERVER_IP/SERVER_KEY for sysweb1, the same pair deploy-test uses.
    environment: test
    concurrency:
      group: publish-packages-test
      cancel-in-progress: false

    env:
      REMOTE_USER: ci
      # Mounted read-only into the Coffee Shop container at /pkgs (see
      # deploy-coffeeshop-test.yml's pkg_host_dir). The backend rescans it
      # every SCAN_INTERVAL_MS, so a new file is listed without a restart.
      CATALOGUE_DIR: /var/www/beanweb-pkgs

    steps:
      # The artifact the build job verified and checksummed -- not a rebuild,
      # so the sums below describe exactly these bytes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Configure SSH
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      # Upload under a temporary name and rename into place, so the backend's
      # rescan can never read a half-written .pkg. No --delete: the catalogue
      # may hold packages not built from pkgs/, and removing one stays a
      # deliberate act on the server.
      - name: Upload .pkg files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -v --checksum --delay-updates --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key" \
            packages/*.pkg "${REMOTE_USER}@${SERVER_IP}:${CATALOGUE_DIR}/"

      - name: Verify checksums on the server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key "${REMOTE_USER}@${SERVER_IP}" \
            "cd '${CATALOGUE_DIR}' && sha256sum -c -" < packages/SHA256SUMS

      - name: Summary
        run: |
          {
            echo '### Published to the test catalogue'
            echo
            echo "\`${CATALOGUE_DIR}\` on the test server. Coffee Shop lists them"
            echo 'after its next rescan (up to ~100 s); an open Browse pane needs'
            echo 'reopening, or *Search* with an empty box.'
            echo
            echo '```'
            cat packages/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
