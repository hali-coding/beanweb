name: Deploy Coffee Shop backend to prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-coffeeshop-reusable.yml
    with:
      environment_name: production
      deploy_path: /var/www/beanweb-coffeeshop/
      port: '8080'
      remote_user: ci
      pkg_host_dir: /var/www/beanweb-pkgs
      bind_addr: 127.0.0.1
      compose_project: beanweb-coffeeshop
    secrets: inherit
