name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment holding this target's SERVER_IP/SERVER_KEY secrets
        required: true
        type: string
      remote_user:
        description: SSH user on the remote server
        required: false
        type: string
        default: github
      deploy_path:
        description: Remote directory to rsync dist/ into
        required: true
        type: string
      web_server:
        description: >-
          Web server in front of deploy_path -- `apache` (the legacy prod box)
          or `nginx` (sysweb1, shared with other sites). nginx is reloaded,
          never restarted, so other sites on the host keep their connections.
        required: false
        type: string
        default: apache

jobs:
  deploy:
    name: 🚀 Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment_name }}

    env:
      BLUE: '\033[1;34m'
      MAGENTA: '\033[1;35m'
      YELLOW: '\033[1;33m'
      CYAN: '\033[1;36m'
      GREEN: '\033[1;32m'
      RESET: '\033[0m'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: |
          echo -e "${BLUE}📦 Installing dependencies...${RESET}"
          npm config set audit false
          npm config set fund false
          npm ci

      - name: 🔨 Build
        run: |
          echo -e "${MAGENTA}🔨 Building the app...${RESET}"
          npm run build
          echo -e "${GREEN}✅ Build complete!${RESET}"

      - name: 🔐 Configure SSH
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo -e "${YELLOW}🔐 Setting up SSH access...${RESET}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          echo -e "${GREEN}✅ SSH ready!${RESET}"

      - name: 📤 Upload build output
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ inputs.remote_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          echo -e "${CYAN}📤 Uploading dist/ to ${SERVER_IP}:${DEPLOY_PATH}...${RESET}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${REMOTE_USER}@${SERVER_IP}:${DEPLOY_PATH}"
          echo -e "${GREEN}✅ Upload complete!${RESET}"

      - name: 🧪 Test web server config
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ inputs.remote_user }}
          WEB_SERVER: ${{ inputs.web_server }}
        run: |
          case "$WEB_SERVER" in
            apache) cmd='sudo apachectl -t' ;;
            nginx)  cmd='sudo nginx -t' ;;
            *) echo "unknown web_server: $WEB_SERVER" >&2; exit 1 ;;
          esac
          echo -e "${CYAN}🧪 Testing ${WEB_SERVER} config...${RESET}"
          ssh -i ~/.ssh/deploy_key "${REMOTE_USER}@${SERVER_IP}" "$cmd"
          echo -e "${GREEN}✅ Config OK!${RESET}"

      - name: 🔄 Reload web server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ inputs.remote_user }}
          WEB_SERVER: ${{ inputs.web_server }}
        run: |
          case "$WEB_SERVER" in
            apache) cmd='sudo systemctl restart apache2' ;;
            nginx)  cmd='sudo systemctl reload nginx' ;;
            *) echo "unknown web_server: $WEB_SERVER" >&2; exit 1 ;;
          esac
          echo -e "${YELLOW}🔄 ${cmd}...${RESET}"
          ssh -i ~/.ssh/deploy_key "${REMOTE_USER}@${SERVER_IP}" "$cmd"
          echo -e "${GREEN}🎉 Deploy finished!${RESET}"
