name: Deploy to prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment_name: production
      deploy_path: /var/www/beanweb/
    secrets: inherit
