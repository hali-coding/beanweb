# Standalone example: `docker compose up` from this directory serves whatever
# is in ../pkgs/dist (run `npm run build:pkgs` from the repo root first, or
# point PKG_DIR/the volume at wherever a real catalogue's .pkg files live).
services:
  coffeeshop:
    build: .
    ports:
      # Loopback by default: the reverse proxy is the only client, and Docker's
      # published ports bypass ufw. CI passes BIND_ADDR=0.0.0.0 for the legacy
      # prod box, whose proxy setup predates this.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080'
    environment:
      PKG_DIR: /pkgs
      SCAN_INTERVAL_MS: '100000'
    volumes:
      # CI points this at the host's catalogue (/var/www/beanweb-pkgs on sysweb1).
      - ${PKG_HOST_DIR:-../pkgs/dist}:/pkgs:ro
    restart: unless-stopped
